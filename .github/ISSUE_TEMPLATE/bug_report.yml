name: Bug report
description: Report reproducible Strip behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private window contents or security vulnerabilities. Use SECURITY.md for private reports.
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "14.6.1"
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Strip commit or version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: permissions
    attributes:
      label: Granted permissions
      options:
        - Accessibility only
        - Accessibility and Screen Recording
        - Neither
        - Unknown
    validations:
      required: true
